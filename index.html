<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TL STUDIO - Login</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #0b0f19;
      color: #e2e8f0;
      position: relative;
    }

    .top-bar {
      position: absolute;
      top: 20px;
      right: 20px;
    }

    .btn-guest {
      background: transparent;
      border: 1px solid rgba(0, 242, 254, 0.4);
      color: #00f2fe;
      padding: 6px 14px;
      font-size: 0.8rem;
      border-radius: 6px;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn-guest:hover {
      background: rgba(0, 242, 254, 0.1);
      border-color: #00f2fe;
      box-shadow: 0 0 10px rgba(0, 242, 254, 0.2);
    }

    .login-card {
      background: rgba(15, 23, 42, 0.75);
      border: 1px solid rgba(56, 189, 248, 0.2);
      backdrop-filter: blur(12px);
      padding: 2.5rem;
      border-radius: 16px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    }

    .header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .brand {
      font-size: 1.8rem;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: 1.5px;
    }

    .brand span {
      color: #00f2fe;
    }

    .subtitle {
      font-size: 0.9rem;
      color: #94a3b8;
      margin-top: 0.5rem;
    }

    .form-group {
      margin-bottom: 1.25rem;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      color: #cbd5e1;
      margin-bottom: 0.5rem;
    }

    .form-group input {
      width: 100%;
      padding: 0.75rem 1rem;
      border-radius: 8px;
      border: 1px solid #1e293b;
      background: #0f172a;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .form-group input:focus {
      border-color: #00f2fe;
    }

    .btn-login {
      width: 100%;
      padding: 0.85rem;
      border: none;
      border-radius: 8px;
      background: linear-gradient(135deg, #00c6ff 0%, #0072ff 100%);
      color: #fff;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 0.5rem;
      transition: opacity 0.2s;
    }

    .btn-login:hover {
      opacity: 0.9;
    }

    .footer-links {
      text-align: center;
      margin-top: 1.5rem;
      font-size: 0.85rem;
      color: #64748b;
    }

    .footer-links a {
      color: #00f2fe;
      text-decoration: none;
    }
  </style>
</head>
<body>

  <div class="top-bar">
    <button class="btn-guest">Entrar sem logar &rarr;</button>
  </div>

  <div class="login-card">
    <div class="header">
      <div class="brand">TL <span>STUDIO</span></div>
      <p class="subtitle">Acesse sua conta para continuar</p>
    </div>

    <form onsubmit="return false;">
      <div class="form-group">
        <label for="email">E-mail</label>
        <input type="email" id="email" placeholder="seu@email.com">
      </div>

      <div class="form-group">
        <label for="password">Senha</label>
        <input type="password" id="password" placeholder="••••••••">
      </div>

      <button type="submit" class="btn-login">Entrar</button>
    </form>

    <div class="footer-links">
      <p>Não tem uma conta? <a href="#">Cadastre-se</a></p>
    </div>
  </div>

</body>
</html>
