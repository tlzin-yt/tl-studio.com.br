<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, collection, getDocs, addDoc, updateDoc, deleteDoc, doc, setDoc, getDoc, serverTimestamp, query, where } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDq8GZiKqDz2TOkemTegDqUknWfXSFN2dA",
      authDomain: "tl-studio-f0f75.firebaseapp.com",
      projectId: "tl-studio-f0f75",
      storageBucket: "tl-studio-f0f75.firebasestorage.app",
      messagingSenderId: "29136188051",
      appId: "1:29136188051:web:90ce7b85e2f7c9c9d0d366",
      measurementId: "G-ENQDHDPHT9"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();

    const btnLogin = document.getElementById('btn-login-google');
    const userDisplay = document.getElementById('user-display');
    const adminDashboard = document.getElementById('admin-dashboard');
    const btnOpenDashboard = document.getElementById('btn-open-dashboard');
    const btnCloseDashboard = document.getElementById('btn-close-dashboard');

    let isAdmin = false;

    btnLogin.addEventListener('click', async () => {
      if (auth.currentUser) {
        try { await signOut(auth); window.location.reload(); } catch (e) { console.error(e); }
      } else {
        try {
          userDisplay.textContent = "A abrir login...";
          await signInWithPopup(auth, provider);
        } catch (error) {
          alert("Erro no login: " + error.message);
          userDisplay.textContent = "Erro na autenticação";
        }
      }
    });

    onAuthStateChanged(auth, (user) => {
      if (user) {
        btnLogin.textContent = 'Sair da Conta';
        userDisplay.textContent = `Olá, ${user.displayName || user.email}`;
        
        if (user.email === 'tuliofonseca00@gmail.com') {
          isAdmin = true;
          btnOpenDashboard.style.display = 'block';
        } else {
          isAdmin = false;
          btnOpenDashboard.style.display = 'none';
          adminDashboard.style.display = 'none';
        }
      } else {
        btnLogin.textContent = 'Entrar com Google';
        userDisplay.textContent = 'Conta Não Autenticada';
        isAdmin = false;
        btnOpenDashboard.style.display = 'none';
        adminDashboard.style.display = 'none';
      }
      loadProducts();
      loadGallery();
      loadComments();
      loadConfig();
    });

    btnOpenDashboard.addEventListener('click', () => {
      adminDashboard.style.display = 'block';
      adminDashboard.scrollIntoView({ behavior: 'smooth' });
    });

    btnCloseDashboard.addEventListener('click', () => {
      adminDashboard.style.display = 'none';
    });

    window.switchAdminTab = function(tabId) {
      document.querySelectorAll('.admin-tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.admin-panel-section').forEach(sec => sec.classList.remove('active'));
      event.target.classList.add('active');
      document.getElementById(tabId).classList.add('active');
    };

    // Função redutora de imagem para caber perfeitamente no Firestore
    function comprimirEConverterImagem(file, callback) {
      const reader = new FileReader();
      reader.onload = function(event) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement('canvas');
          const MAX_WIDTH = 800;
          const MAX_HEIGHT = 800;
          let width = img.width;
          let height = img.height;

          if (width > height) {
            if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; }
          } else {
            if (height > MAX_HEIGHT) { width *= MAX_HEIGHT / height; height = MAX_HEIGHT; }
          }

          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);
          
          // Converte para JPEG comprimido (otimizado para nuvem)
          const dataUrl = canvas.toDataURL('image/jpeg', 0.75);
          callback(dataUrl);
        };
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
    }

    document.getElementById('adm-prod-file').addEventListener('change', function() {
      const file = this.files[0];
      if (file) {
        comprimirEConverterImagem(file, (base64) => {
          document.getElementById('adm-prod-img-base64').value = base64;
          document.getElementById('prod-preview-text').textContent = `✔ Imagem pronta a salvar!`;
          document.getElementById('prod-preview-text').style.color = 'var(--cyan-neon)';
        });
      }
    });

    document.getElementById('adm-galeria-file').addEventListener('change', function() {
      const file = this.files[0];
      if (file) {
        comprimirEConverterImagem(file, (base64) => {
          document.getElementById('adm-galeria-img-base64').value = base64;
          document.getElementById('galeria-preview-text').textContent = `✔ Imagem pronta a salvar!`;
          document.getElementById('galeria-preview-text').style.color = 'var(--cyan-neon)';
        });
      }
    });

    // --- PRODUTOS ---
    async function loadProducts() {
      const productsContainer = document.getElementById('products-container');
      try {
        const querySnapshot = await getDocs(collection(db, "produtos"));
        if (querySnapshot.empty) {
          productsContainer.innerHTML = '<p style="color: var(--text-muted);">Nenhum produto cadastrado no banco de dados.</p>';
          return;
        }

        let html = '';
        querySnapshot.forEach((docItem) => {
          const prod = docItem.data();
          const prodId = docItem.id;
          
          html += `
            <div class="cyber-frame product-card">
              <div class="media-slot">
                <span class="hud-tag">PRODUTO</span>
                <img src="${prod.imagem || 'img/product_web.jpg'}" alt="${prod.titulo}" onerror="this.src='https://images.unsplash.com/photo-1550745165-9bc0b252726f?w=500&auto=format&fit=crop&q=60';">
              </div>
              <div class="card-content">
                <div>
                  <h3 class="product-title">${prod.titulo}</h3>
                  <p class="product-desc">${prod.descricao || ''}</p>
                </div>
                <div class="product-footer">
                  <span class="price-value">${prod.preco}</span>
                  <button class="btn-details" onclick="alert('Iniciando atendimento para: ${prod.titulo}')">Comprar</button>
                </div>
                ${isAdmin ? `
                  <div style="display:flex; gap:8px; margin-top:12px;">
                    <button class="btn-edit" style="flex:1;" onclick="prepararEdicaoProduto('${prodId}', '${prod.titulo}', '${prod.preco}', '${prod.descricao.replace(/'/g, "\\'")}')">Editar</button>
                    <button class="btn-danger" style="flex:1;" onclick="deletarProduto('${prodId}')">Excluir</button>
                  </div>
                ` : ''}
              </div>
            </div>
          `;
        });
        productsContainer.innerHTML = html;
      } catch (e) { console.error("Erro ao carregar produtos:", e); }
    }

    document.getElementById('btn-save-product').addEventListener('click', async () => {
      const id = document.getElementById('adm-prod-id').value;
      const titulo = document.getElementById('adm-prod-title').value.trim();
      const preco = document.getElementById('adm-prod-price').value.trim();
      const descricao = document.getElementById('adm-prod-desc').value.trim();
      let imagem = document.getElementById('adm-prod-img-base64').value;

      if (!titulo || !preco) { alert('Preencha o título e o preço.'); return; }

      const dadosProduto = { titulo, preco, descricao };
      if (imagem) dadosProduto.imagem = imagem;

      try {
        if (id) {
          await updateDoc(doc(db, "produtos", id), dadosProduto);
          alert('Produto atualizado na nuvem com sucesso!');
        } else {
          dadosProduto.criadoEm = serverTimestamp();
          await addDoc(collection(db, "produtos"), dadosProduto);
          alert('Produto salvo no banco de dados com sucesso!');
        }

        document.getElementById('adm-prod-id').value = '';
        document.getElementById('adm-prod-title').value = '';
        document.getElementById('adm-prod-price').value = '';
        document.getElementById('adm-prod-desc').value = '';
        document.getElementById('adm-prod-img-base64').value = '';
        document.getElementById('prod-preview-text').textContent = 'Nenhuma imagem selecionada.';
        loadProducts();
      } catch (err) {
        alert("Erro ao salvar no Firestore: " + err.message);
      }
    });

    window.prepararEdicaoProduto = function(id, titulo, preco, desc) {
      document.getElementById('adm-prod-id').value = id;
      document.getElementById('adm-prod-title').value = titulo;
      document.getElementById('adm-prod-price').value = preco;
      document.getElementById('adm-prod-desc').value = desc;
      document.getElementById('prod-preview-text').textContent = '✔ Mantém imagem anterior (ou escolha nova)';
      adminDashboard.style.display = 'block';
      adminDashboard.scrollIntoView({ behavior: 'smooth' });
      switchAdminTab('tab-produtos');
    };

    window.deletarProduto = async function(id) {
      if (confirm('Tem certeza que deseja excluir este produto?')) {
        await deleteDoc(doc(db, "produtos", id));
        loadProducts();
      }
    };

    // --- GALERIA ---
    async function loadGallery() {
      const galleryContainer = document.getElementById('gallery-container');
      try {
        const querySnapshot = await getDocs(collection(db, "galeria"));
        if (querySnapshot.empty) {
          galleryContainer.innerHTML = '<p style="color: var(--text-muted);">Nenhum projeto na galeria.</p>';
          return;
        }

        let html = '';
        querySnapshot.forEach((docItem) => {
          const item = docItem.data();
          const itemId = docItem.id;

          html += `
            <div class="cyber-frame portfolio-card">
              <div class="media-slot">
                <span class="hud-tag">PROJETO</span>
                <img src="${item.imagem}" alt="${item.titulo}" onerror="this.src='https://images.unsplash.com/photo-1550745165-9bc0b252726f?w=500&auto=format&fit=crop&q=60';">
              </div>
              <div style="padding: 1.5rem;">
                <h4>${item.titulo}</h4>
                <p style="color: var(--text-dim); font-size: 0.85rem;">${item.subtitulo || ''}</p>
                ${isAdmin ? `
                  <div style="display:flex; gap:8px; margin-top:12px;">
                    <button class="btn-edit" style="flex:1;" onclick="prepararEdicaoGaleria('${itemId}', '${item.titulo}', '${item.subtitulo}')">Editar</button>
                    <button class="btn-danger" style="flex:1;" onclick="deletarGaleria('${itemId}')">Excluir</button>
                  </div>
                ` : ''}
              </div>
            </div>
          `;
        });
        galleryContainer.innerHTML = html;
      } catch (e) { console.error("Erro ao carregar galeria:", e); }
    }

    document.getElementById('btn-save-galeria').addEventListener('click', async () => {
      const id = document.getElementById('adm-galeria-id').value;
      const titulo = document.getElementById('adm-galeria-title').value.trim();
      const subtitulo = document.getElementById('adm-galeria-sub').value.trim();
      let imagem = document.getElementById('adm-galeria-img-base64').value;

      if (!titulo) { alert('Preencha o título do projeto.'); return; }

      const dadosGaleria = { titulo, subtitulo };
      if (imagem) dadosGaleria.imagem = imagem;

      try {
        if (id) {
          await updateDoc(doc(db, "galeria", id), dadosGaleria);
          alert('Galeria atualizada na nuvem!');
        } else {
          if (!imagem) { alert('Selecione uma imagem da galeria do aparelho.'); return; }
          dadosGaleria.criadoEm = serverTimestamp();
          await addDoc(collection(db, "galeria"), dadosGaleria);
          alert('Imagem enviada para a galeria pública com sucesso!');
        }

        document.getElementById('adm-galeria-id').value = '';
        document.getElementById('adm-galeria-title').value = '';
        document.getElementById('adm-galeria-sub').value = '';
        document.getElementById('adm-galeria-img-base64').value = '';
        document.getElementById('galeria-preview-text').textContent = 'Nenhuma imagem selecionada.';
        loadGallery();
      } catch (err) {
        alert("Erro ao salvar galeria: " + err.message);
      }
    });

    window.prepararEdicaoGaleria = function(id, titulo, sub) {
      document.getElementById('adm-galeria-id').value = id;
      document.getElementById('adm-galeria-title').value = titulo;
      document.getElementById('adm-galeria-sub').value = sub;
      document.getElementById('galeria-preview-text').textContent = '✔ Mantém imagem anterior (ou escolha nova)';
      adminDashboard.style.display = 'block';
      adminDashboard.scrollIntoView({ behavior: 'smooth' });
      switchAdminTab('tab-galeria');
    };

    window.deletarGaleria = async function(id) {
      if (confirm('Tem certeza que deseja excluir este item da galeria?')) {
        await deleteDoc(doc(db, "galeria", id));
        loadGallery();
      }
    };

    // --- AVALIAÇÕES ---
    async function loadComments() {
      const commentsContainer = document.getElementById('comments-container');
      try {
        const querySnapshot = await getDocs(collection(db, "comentarios"));
        if (querySnapshot.empty) {
          commentsContainer.innerHTML = '<p style="color: var(--text-muted);">Nenhuma avaliação enviada ainda.</p>';
          return;
        }

        let html = '';
        querySnapshot.forEach((docItem) => {
          const c = docItem.data();
          const cId = docItem.id;
          const starsText = '★'.repeat(c.estrelas || 5) + '☆'.repeat(5 - (c.estrelas || 5));

          html += `
            <div class="cyber-frame comment-card" style="padding: 1.8rem;">
              <div style="color: #ffb703; margin-bottom: 0.5rem;">${starsText}</div>
              <p style="font-style: italic; font-size: 0.95rem; margin-bottom: 1rem;">"${c.texto}"</p>
              <div style="display:flex; justify-content:space-between; align-items:center;">
                <div>
                  <h5 style="color:#fff;">${c.nome}</h5>
                  <span style="font-size:0.75rem; color:var(--text-dim);">${c.projeto}</span>
                </div>
                ${isAdmin ? `<button class="btn-danger" onclick="deletarComentario('${cId}')">Remover</button>` : ''}
              </div>
            </div>
          `;
        });
        commentsContainer.innerHTML = html;
      } catch (e) { console.error(e); }
    }

    document.getElementById('btn-send-comment').addEventListener('click', async () => {
      const nome = document.getElementById('cli-name').value.trim();
      const projeto = document.getElementById('cli-proj').value.trim();
      const estrelas = parseInt(document.getElementById('cli-stars').value, 10);
      const texto = document.getElementById('cli-text').value.trim();

      if (!nome || !texto) { alert('Preencha seu nome e a sua avaliação.'); return; }

      await addDoc(collection(db, "comentarios"), { nome, projeto, estrelas, texto, criadoEm: serverTimestamp() });
      alert('Sua avaliação foi enviada com sucesso!');
      document.getElementById('cli-name').value = '';
      document.getElementById('cli-proj').value = '';
      document.getElementById('cli-text').value = '';
      loadComments();
    });

    window.deletarComentario = async function(id) {
      if (confirm('Remover esta avaliação?')) {
        await deleteDoc(doc(db, "comentarios", id));
        loadComments();
      }
    };

    // --- CONFIGURAÇÕES ---
    async function loadConfig() {
      try {
        const docRef = doc(db, "configuracoes", "geral");
        const docSnap = await getDoc(docRef);

        if (docSnap.exists()) {
          const cfg = docSnap.data();
          if (cfg.aboutP1) document.getElementById('display-about-p1').textContent = cfg.aboutP1;
          if (cfg.aboutP2) document.getElementById('display-about-p2').textContent = cfg.aboutP2;
          if (cfg.aboutP1) document.getElementById('adm-about-p1').value = cfg.aboutP1;
          if (cfg.aboutP2) document.getElementById('adm-about-p2').value = cfg.aboutP2;

          if (cfg.linkDiscord) { document.getElementById('link-discord-btn').href = cfg.linkDiscord; document.getElementById('adm-link-discord').value = cfg.linkDiscord; }
          if (cfg.linkWhatsapp) { document.getElementById('link-whatsapp-btn').href = cfg.linkWhatsapp; document.getElementById('adm-link-whatsapp').value = cfg.linkWhatsapp; }
          if (cfg.linkInstagram) { document.getElementById('link-instagram-btn').href = cfg.linkInstagram; document.getElementById('adm-link-instagram').value = cfg.linkInstagram; }
          if (cfg.linkPortfolio) { document.getElementById('link-portfolio-btn').href = cfg.linkPortfolio; document.getElementById('adm-link-portfolio').value = cfg.linkPortfolio; }
        }
      } catch (e) { console.error(e); }
    }

    document.getElementById('btn-save-about').addEventListener('click', async () => {
      const p1 = document.getElementById('adm-about-p1').value.trim();
      const p2 = document.getElementById('adm-about-p2').value.trim();
      await setDoc(doc(db, "configuracoes", "geral"), { aboutP1: p1, aboutP2: p2 }, { merge: true });
      alert('Texto do Sobre Mim atualizado na nuvem!');
      loadConfig();
    });

    document.getElementById('btn-save-links').addEventListener('click', async () => {
      const linkDiscord = document.getElementById('adm-link-discord').value.trim();
      const linkWhatsapp = document.getElementById('adm-link-whatsapp').value.trim();
      const linkInstagram = document.getElementById('adm-link-instagram').value.trim();
      const linkPortfolio = document.getElementById('adm-link-portfolio').value.trim();
      await setDoc(doc(db, "configuracoes", "geral"), { linkDiscord, linkWhatsapp, linkInstagram, linkPortfolio }, { merge: true });
      alert('Links atualizados na nuvem!');
      loadConfig();
    });

    // --- CONSULTA DE VENDAS ---
    document.getElementById('btn-search-purchase').addEventListener('click', async () => {
      const email = document.getElementById('search-email-input').value.trim().toLowerCase();
      const box = document.getElementById('search-result-box');
      if (!email) { alert('Digite um e-mail.'); return; }

      box.innerHTML = 'Pesquisando...';
      try {
        const q = query(collection(db, "compras"), where("email", "==", email));
        const querySnapshot = await getDocs(q);

        if (querySnapshot.empty) {
          box.innerHTML = `<span style="color:#f72585;">❌ Nenhuma compra encontrada para: <strong>${email}</strong></span>`;
          return;
        }

        let html = `<div style="background:rgba(0,242,254,0.05); border:1px solid var(--cyan-neon); padding:1rem; border-radius:8px;">`;
        querySnapshot.forEach((docItem) => {
          const d = docItem.data();
          html += `<div style="border-top:1px solid rgba(255,255,255,0.1); padding-top:6px; margin-top:6px;">
            <p><strong>Produto:</strong> ${d.produto || 'N/A'}</p>
            <p><strong>Status:</strong> <span style="color:var(--cyan-neon);">${d.status || 'Aprovado'}</span></p>
          </div>`;
        });
        html += `</div>`;
        box.innerHTML = html;
      } catch (e) { box.innerHTML = 'Erro na busca.'; }
    });

    const menuToggle = document.getElementById('menu-toggle');
    const btnClose = document.getElementById('btn-close');
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('sidebar-overlay');

    menuToggle.addEventListener('click', () => { sidebar.classList.add('active'); overlay.classList.add('active'); });
    btnClose.addEventListener('click', () => { sidebar.classList.remove('active'); overlay.classList.remove('active'); });
    overlay.addEventListener('click', () => { sidebar.classList.remove('active'); overlay.classList.remove('active'); });
  </script>
